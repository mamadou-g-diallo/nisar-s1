name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with its declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run the tests from outside the repository (installed package)
        run: |
          cd "$RUNNER_TEMP"
          python -c "import nisar_s1; print(nisar_s1.__version__, nisar_s1.__file__)"
          nisar-s1 --version
          pytest -q "$GITHUB_WORKSPACE/tests" -p no:cacheprovider
