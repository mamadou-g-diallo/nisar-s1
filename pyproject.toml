[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar_s1"
version = "0.5.0"
description = "Read NISAR L2 products and compare L-band (NISAR, future ROSE-L) with C-band (Sentinel-1) SAR: coherence, backscatter, dual-pol polarimetry, change separability"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mamadou Galy Diallo" }]
keywords = ["NISAR", "polarimetry", "GCOV", "GSLC", "Sentinel-1", "SAR", "InSAR", "coherence", "forest", "clear-cut", "ROSE-L", "ISCE3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "h5py>=3.8",
    "fsspec>=2023.1",
    "affine>=2.4",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "asf_search>=8.0",
    "earthaccess>=0.9",
    "pystac-client>=0.7",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
]

[project.scripts]
nisar-s1 = "nisar_s1.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/mamadou-g-diallo/nisar-s1"
Repository = "https://github.com/mamadou-g-diallo/nisar-s1"
Issues = "https://github.com/mamadou-g-diallo/nisar-s1/issues"
Changelog = "https://github.com/mamadou-g-diallo/nisar-s1/blob/main/CHANGELOG.md"
"Case study" = "https://github.com/mamadou-g-diallo/nisar-s1-forest-feasibility"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nisar_s1 = ["graphs/*.xml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
